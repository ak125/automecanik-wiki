    status: active
    license: captured_for_internal_review
    notes: |
      Page d'atelier équipementier « Brake Judder » (capture RAW 2026-10-10,
      sha256:46ef0642…), rédigée en ANGLAIS : la fiche disque-de-frein en porte
      une reformulation en français, la capture RAW reste dans sa langue d'origine.
      Passages retenus : définition du broutement (vibrations de rotation du volant
      au freinage, en général avec un bruit sourd) ; broutement thermique (dépôt de
      matière de la plaquette sur le disque, zones durcies du disque) et broutement
      à froid (pulsation de la pédale, cause principale = variation d'épaisseur du
      disque) ; origines de la variation d'épaisseur (faux-rond dû au montage,
      plaquettes ou pistons légèrement grippés, saleté, corrosion, serrage excessif,
      longs trajets à freinages très légers) ; recherche pas à pas (essieu, chaîne
      de freinage, roues, trains roulants) ; remplacement plaquettes et disques par
      essieu complet « pour des raisons de sécurité » ; moyeu propre, plan, sans
      excès de graisse ; idée reçue du « léger voile nécessaire » contredite.
      Ne fonde PAS : de valeur publiable (les tolérances chiffrées de la page sont
      volontairement non reprises dans une fiche sécurité), de règle d'usure ou
      d'épaisseur minimale, de périodicité, ni aucune promesse produit (passages
      marque et catalogue ignorés).

