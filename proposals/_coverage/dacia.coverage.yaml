notes: |
  Coverage map dacia — réécrite 2026-10-11 avec la fiche.

  52 claims, chacun rattaché à UNE page archivée dans RAW
  (sources/auto-captures/divers/, PR RAW #69) :
  - article encyclopédique (wikipedia_fr_dacia) : 47 claims, corroboration
    seulement (plafond low) ;
  - page d'accueil du site constructeur (dacia_corporate_factsheet_2024,
    slug historique) : 5 claims (plafond medium).
  Toutes les entrées sont en pending_capture (les deux sources sont
  to_capture) et en manual_review : aucune des deux n'est une source de preuve
  (manuel ou documentation atelier du constructeur), et la concordance d'une
  source low et d'une source medium ne satisfait pas 2_medium_concordant.

  Les cinq entrées de l'ancien registre sont remplacées : fondation 1966,
  rachat de 1999 et lancement de la Logan sont repris sous de nouveaux
  identifiants, ancrés sur la prose réécrite d'après l'article ; la gamme
  « millésime 2024 » et la Sandero « la plus vendue en Europe aux
  particuliers depuis 2017 » sont retirées, absentes des deux captures.

  Passage en captured = acte propriétaire, après activation des deux sources
  (expected_sha256 + status active) et relecture de chaque claim contre sa
  capture. Promotion : exige une source de preuve constructeur, absente à ce
  jour.
