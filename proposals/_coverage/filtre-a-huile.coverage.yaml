notes: |
  Coverage map filtre-a-huile — réécrite 2026-09-30 avec la fiche.

  17 claims, chacun rattaché à UNE page archivée dans RAW
  (sources/auto-captures/filtre-a-huile/) :
  - Filtron (active) : 2 claims déjà captured (inchangés) + 4 nouveaux en
    pending_capture ;
  - MAHLE Aftermarket (to_capture) : 9 claims pending_capture ;
  - notice Renault Clio 5 phase 1 (to_capture) : 2 claims pending_capture.

  Retirés avec leurs affirmations (aucune capture ne les prouve) : ISO 4548
  (efficacité, by-pass, anti-retour), MANN-FILTER (média, cartouche/vissé,
  clapets portés par le boîtier), règlement UE 461/2010 (trois niveaux, OES),
  maintenance OEM générique (« à chaque vidange », capacité de rétention).

  Passage en captured = acte propriétaire, après activation des sources MAHLE
  et Renault (expected_sha256 + status active) et relecture de chaque claim
  contre sa capture. Question ouverte pour le vault : une page produit
  d'équipementier doit-elle rester typée oem_manual (plafond high) ?

  Révision 2026-11-15 (mandat T) : 25 claims ajoutés pour les sections de
  procédure (Avant de commencer, Dépose, Repose, Contrôles après montage), la
  FAQ de sélection et la FAQ en paires. 21 portent sur quatre pages archivées
  le 2026-11-15 (Filtron remplacement, Filtron témoin, MAHLE joints, notice
  Renault Twingo 3 phase 2), inscrites au catalogue en to_capture : ces claims
  restent pending_capture jusqu'à l'activation owner (reçu signé) après fusion
  de automecanik-raw PR #78. Les 4 autres reprennent des sources déjà actives
  (MAHLE conception, Filtron clapets). Aucune valeur de serrage, d'intervalle,
  de capacité ou de délai n'est couverte : la fiche n'en publie aucune.
