  53 claims : 24 captured (sources actives Filtron clapets, MAHLE conception, notice Clio
  5 phase 1), 29 pending_capture (Filtron remplacement, Filtron témoin, MAHLE joints, notice
  Twingo 3 phase 2, sources to_capture depuis automecanik-raw PR #78). Passage en captured
  = activation owner de la source, puis relecture du claim contre sa capture.


  Valeurs couvertes : serrage habituel (Filtron, subordonné à l''indication du filtre), attente
  d''environ 10 minutes (Twingo), quelques secondes d''allumage du témoin (Filtron). Retirés
  avec leur texte : la relation et le paragraphe « perte de puissance », l''orientation «
  tête en bas » du clapet anti-retour, le choix « à partir du véhicule dans le catalogue »
  et la distinction avec les autres filtres, non portés par les captures.'
